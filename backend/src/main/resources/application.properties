spring.application.name=backend

# No datasource is configured yet: the repository layer uses in-memory data for this
# assessment (a DB is optional per the spec). Excluding DataSource autoconfiguration
# stops Spring Boot from trying to build a Hikari pool against a driver/URL that
# doesn't exist. Remove this once/if a real datasource is wired up.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
